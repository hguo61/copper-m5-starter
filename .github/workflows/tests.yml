name: Tests

# The gate for main: every pull request into main runs the app's tests.
# Branch protection on main requires the "tests" check below to pass, so a
# pull request with a failing test can't be merged.
on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep this job name: branch protection looks for a check called "tests".
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # Optional. With this Actions secret set, the live AI test runs too;
          # without it, that one test is skipped.
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
